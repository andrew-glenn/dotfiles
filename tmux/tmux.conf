
# TERM setting

set -g default-terminal "tmux-256color"

# Kill the Esc key delay — otherwise tmux waits ~500ms after Esc to see if it's
# the start of an escape sequence, which lags Esc in vim/nvim. 0 = instant.
set -sg escape-time 0

# UTF-8 — force it explicitly on the server env so panes get a UTF-8 locale
# even when the invoking shell's LANG/LC_ALL is unset or non-UTF-8.
set-environment -g LANG en_US.UTF-8
set-environment -g LC_ALL en_US.UTF-8
# Binding / Unbinding.
unbind +
unbind -
unbind [
bind Escape copy-mode
bind R source-file ~/.tmux.conf \; display "Config reloaded..."


# Alt+(LEFT/RIGHT/UP/DOWN)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-p paste-buffer

# Alt+# — jump straight to window N in the current session (no prefix).
# base-index is 1, so Alt+1 = first window; Alt+0 maps to window 10.
# When the prefix is toggled off (Shift-F9 passthrough mode), forward the
# keystroke to the running program instead of switching windows.
bind -n M-1 if-shell -F "#{==:#{prefix},None}" { send-keys M-1 } { select-window -t :1 }
bind -n M-2 if-shell -F "#{==:#{prefix},None}" { send-keys M-2 } { select-window -t :2 }
bind -n M-3 if-shell -F "#{==:#{prefix},None}" { send-keys M-3 } { select-window -t :3 }
bind -n M-4 if-shell -F "#{==:#{prefix},None}" { send-keys M-4 } { select-window -t :4 }
bind -n M-5 if-shell -F "#{==:#{prefix},None}" { send-keys M-5 } { select-window -t :5 }
bind -n M-6 if-shell -F "#{==:#{prefix},None}" { send-keys M-6 } { select-window -t :6 }
bind -n M-7 if-shell -F "#{==:#{prefix},None}" { send-keys M-7 } { select-window -t :7 }
bind -n M-8 if-shell -F "#{==:#{prefix},None}" { send-keys M-8 } { select-window -t :8 }
bind -n M-9 if-shell -F "#{==:#{prefix},None}" { send-keys M-9 } { select-window -t :9 }
bind -n M-0 if-shell -F "#{==:#{prefix},None}" { send-keys M-0 } { select-window -t :10 }
bind -n M-a run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh sp"


bind-key -n S-F11 if-shell "env | grep -i tmux_scratch" {run-shell "tmux detach -s scratch"}{ display-popup -xC -yC -w80% -h80% -E "tmux new-session -A -e TMUX_SCRATCH_SESSION=true -s scratch 'kiro-cli chat --agent sp'" }

# When scratch session is created (by S-F11 or _sp), name window 0 "sp" and
# auto-respawn if it dies. The hook fires for ALL sessions but the if-shell
# gates it to scratch only.
set-hook -g session-created 'if -F "#{==:#{session_name},scratch}" "rename-window -t scratch:0 sp ; set-option -t scratch:0 remain-on-exit on"'
set-hook -ga pane-died 'if -F "#{==:#{session_name},scratch}" "if -F \"#{==:#{window_index},0}\" \"respawn-pane -t scratch:0 \\\"kiro-cli chat --agent sp\\\"\""'
bind-key -n S-F12 display-popup -xC -yC -w90% -h90% -E -d "#{pane_current_path}"
bind-key -n S-F10 if-shell -F "#{==:#{prefix},None}" { send-keys S-F10 } { display-popup -xC -yC -w100% -h100% -E -d "#{pane_current_path}" "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh lazygit" }
bind-key -n S-F9 run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh prefix"
bind-key -n S-F7 display-popup -xC -yC -w60% -h50% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh switcher"
bind-key -T copy-mode-vi S-F7 display-popup -xC -yC -w60% -h50% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh switcher"
bind-key -T copy-mode S-F7 display-popup -xC -yC -w60% -h50% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh switcher"
bind-key w display-popup -xC -yC -w60% -h50% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh switcher"
bind-key -n S-F8 run-shell "tmux display-popup -xC -yC -w60% -h50% -E '${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh send_pane #{pane_id}'"

# New session: popup prompt for the name (picks existing to switch instead)
bind-key -n S-F6 display-popup -xC -yC -w60% -h40% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh new_session '#{pane_current_path}'"
bind-key N display-popup -xC -yC -w60% -h40% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh new_session '#{pane_current_path}'"

set -g set-clipboard on
set -g detach-on-destroy previous
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"


bind-key -T root WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e"
bind-key v copy-mode

#bind-key -T root v display-popup -xC -yC -w90% -h90% -E nvim ~/.vimrc
#bind-key -T popup s if-shell "env | grep -i tmux_scratch" {run-shell "tmux detach -s scratch"}{ display-popup -xC -yC -w80% -h80% -E "tmux new-session -A -e TMUX_SCRATCH_SESSION=true -s scratch" }
#bind-key -T root C-F11 display-popup -xC -yC -w90% -h90% -E -d "#{pane_current_path}" lazygit
#bind-key -T popup / display-popup -xC -yC -w90% -h90% -E "grep -i 'bind-key -T popup' ~/.tmux.conf | more"
#
# bind-key 7 is reserved for spotify.

#bind-key -T vi-copy 'y' copy-selection

# New panes/splits/windows in the CWD
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# New window in the current path (unnamed -> shows just its number).
bind c new-window -c "#{pane_current_path}"

# Rename a window: prompt (pre-filled with current name) and tag it @named so
# the status line shows ".name". This is how a window earns a visible name now
# that the new-window popup is gone.
bind , command-prompt -I "#W" "rename-window '%%' ; set-window-option @named 1"
set -g bell-action other
# Mouse Mode
bind u run "source ${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh &&  _toggle_mouse"

# Join pane from another window
bind-key J display-popup -xC -yC -w60% -h50% -E "tmux list-panes -a -F '#S:#I.#P  #W | #{pane_current_command} (#{pane_current_path})' | grep -v \"$(tmux display-message -p '#S:#I')\" | fzf --reverse --header='Join pane into current window:' | awk '{print $1}' | xargs -I{} tmux join-pane -s {}"

# Sync pances
bind s run "source ${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh && _toggle_pane_sync"

# Silence Monitoring
bind-key m run "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh silence"
bind-key j display-popup -xC -yC -w90% -h90% -E "tmux list-sessions -F '#S' | fzf --reverse | xargs tmux switch-client -t"
bind-key k display-popup -xC -yC -w90% -h90% -E "tmux list-window -F '#W' | fzf --reverse | xargs tmux select-window -t"

# Pane jumper: all panes across all sessions, fzf-selected
bind-key P display-popup -xC -yC -w90% -h90% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh pane_jumper"

# Switch to previous session
bind-key C-b run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh prev"

# Launch sp (kiro-cli scratchpad agent)
bind-key A run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh sp"

# Zen mode — padding panes + hide status bar
bind-key Z run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh zen"

# Theme cycling: prefix+y -> next theme, prefix+Y -> previous. Pins the choice
# via @theme for this session; the status line shows the new theme name.
bind-key y run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh theme_cycle next"
bind-key Y run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh theme_cycle prev"

# Layout Shortcuts.
bind-key H select-layout even-vertical
bind-key T select-layout tiled
bind-key V select-layout even-horizontal

bind-key a send-prefix
# Send Prefix (use C-b C-b for nested sessions)
# bind-key a send-prefix
set -g default-terminal "screen-256color"
set -g renumber-windows on
# Start window and pane numbering at 1 (so Alt+1 = first window)
set -g base-index 1
setw -g pane-base-index 1
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set -g status-position top
# (status-style, status-interval, pane border colors, and the clock color are
# all set once in the themed status-bar section below — old duplicate/themepack
# leftovers removed here so there's a single source of truth.)
set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/socket/ssh_auth_sock
set-option -g allow-rename off
run-shell "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh theme"
set-window-option -g aggressive-resize on
setw -g mode-keys vi

# (window-status formats are defined once, in the status-bar section below)

# ==============================================================================
# Custom theme overrides — minimal brackets. Off-white text, single cyan
# accent, no backgrounds. Delete everything below to revert.
# ==============================================================================

set -g xterm-keys on 
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Palette — host-conditional, set by _host_specific_theme in
# tmux.functions.sh (invoked from the run-shell line near the top of this
# file). Styles below reference these user options; format expansion at
# render time picks up whatever the function set.
#   @c_text   = primary text
#   @c_dim    = separators, idle bits
#   @c_accent = active window, session, borders
#   @c_actv   = activity flash
#   colour196 = red bell (shared)

# --- Status bar ----------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#{@c_text}"

# Old-school substance, 2025 polish: plain text + box-drawing dividers (│).
# No Nerd Font glyphs, no powerline blocks. Just crisp separators, a dim/bright
# label\:value hierarchy, and hostname context. Box-drawing chars render in every
# monospace font (ncurses-era), so this stays portable across hosts.

# Left: [session]  user@host   SYNC?
# Host label: defaults to the real short hostname (#h). To show a nickname on a
# box with an ugly/long hostname, override in that host's ~/.tmux.local.conf:
#   set -g @host_label "prod-db"
set -g @host_label "#h"

set -g status-left-length 120
set -g status-left "#[fg=#{@c_accent},bold]#S#[fg=#{@c_text},nobold] #{E:@host_label} #[fg=#{@c_dim}]│ #{?pane_synchronized,#[fg=colour196#,bold]SYNC ,}"

# Right: <load> │ <bat%> │ HH:MM  — no labels, values only.
# load value is color-coded by saturation vs. core count (green/amber/red);
# battery value is color-coded by charge level / charging state.
set -g status-right-length 120
set -g status-right "#(${DOTFILES_GIT_REPO}/tmux/tmux.status.sh load) #[fg=#{@c_dim}]│ #(${DOTFILES_GIT_REPO}/tmux/tmux.status.sh battery) #[fg=#{@c_dim}]│ #[fg=#{@c_text},bold]%H:%M#[fg=#{@c_dim},nobold] #[fg=#{@c_dim}]#(date -u +%%H:%%M)z"

# Windows: modern tab feel — accent number, dim name, no brackets. The current
# window's number pops in bold accent; its name stays readable in text color.
setw -g window-status-style "fg=#{@c_dim}"
setw -g window-status-current-style "fg=#{@c_accent},bold"
# Window entries are COLOR-CODED by state instead of showing #F suffix symbols.
#   activity (was !) -> @c_actv (bright)
#   silence  (was ~) -> colour244 (muted grey)
#   zoom     (was Z) -> colour196 (red) on the current window
# Inactive window color: activity wins over silence wins over normal dim.
# Each flag is ANDed with its monitor-* option: tmux only clears an alert flag
# when a client next views the window, so a flag set while monitoring was on
# stays set afterwards and would keep recoloring the index. Gating on the
# option means turning monitoring off takes effect immediately.
#
# ".name" is appended only for windows that were given a deliberate name.
# automatic-rename is the signal: tmux turns it off for a window as soon as
# that window is renamed, whether by prefix+, by `new-window -n`, or by a
# hook, and leaves it on while the name just tracks the running command. The
# explicit @named tag is still honoured so a name can be forced on a window
# that is otherwise auto-renamed.
setw -g window-status-format "#[fg=#{?#{&&:#{monitor-activity},#{window_activity_flag}},#{@c_actv},#{?#{&&:#{monitor-silence},#{window_silence_flag}},colour244,#{@c_dim}}}]#I#{?#{||:#{@named},#{?#{automatic-rename},0,1}},.#W,}"
# Current window: red if a pane is zoomed, else the accent color.
setw -g window-status-current-format "#[fg=#{?#{window_zoomed_flag},colour196,#{@c_accent}},bold]#I#{?#{||:#{@named},#{?#{automatic-rename},0,1}},.#W,}"
# (state coloring is handled inline in the -format strings above, not via
# per-state -style overrides, so those are intentionally left at defaults)
setw -g window-status-separator " "

# Activity and silence detection are both off. Silence used to be monitored
# globally at 15s, which recolored every idle window's index to grey and made
# indexes appear to flash: any output cleared the flag back to the normal dim,
# then it re-set 15 seconds later. The status format above still understands
# both flags, so `prefix+m` can enable silence per window when it is wanted.
setw -g monitor-activity off
set -g visual-activity off
setw -g monitor-silence 0
set -g visual-silence off

# --- Panes ---------------------------------------------------------------------
# Active pane is made obvious by its FRAME, not by dimming content (tmux can't
# dim already-colored text like the zsh prompt). The active border is a bold
# accent-colored heavy line; inactive borders are a near-invisible dark grey.
set -g pane-border-style "fg=#020202"
set -g pane-active-border-style "fg=#{@c_accent}"
set -g pane-border-lines single
set -g pane-border-indicators colour

# Border bar on top of each pane acts purely as a colored divider — no text.
# The active pane's bar is a solid accent line; inactive bars are near-invisible.
set -g pane-border-format "#{?pane_active,#[fg=#{@c_accent}],#[fg=#020202]}"

# Only show the title bar when a window actually has multiple panes — a lone
# pane needs no "you are here" label. Off by default; hooks flip it on/off as
# panes are added or removed. #{?...} is re-evaluated per window on each event.
set -g pane-border-status off
set-hook -g after-split-window   'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g pane-exited          'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g after-kill-pane      'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'

# (No content dimming — the active pane is distinguished by its bold accent
# border + title bar instead, which works regardless of what's running.)

# --- Message / command prompt --------------------------------------------------
set -g message-style "fg=#{@c_accent},bold"
set -g message-command-style "fg=#{@c_text},bold"

# --- Mode (copy/selection) -----------------------------------------------------
setw -g mode-style "bg=#{@c_accent},fg=colour16,bold"

# --- Clock: theme-colored (clock-mode-colour is set by the theme function) ---
setw -g clock-mode-style 24
# Override prefix-t: fullscreen popup running tty-clock (24hr, seconds).
# Falls back to figlet -> plain date.
# Exit: press any key (q, Esc, Enter, whatever). Ctrl-c also works.
bind-key t display-popup -xC -yC -w90% -h90% -E "\
  if command -v tty-clock >/dev/null 2>&1; then \
    tty-clock -cS; \
  elif command -v figlet >/dev/null 2>&1; then \
    tput civis; trap 'tput cnorm; clear' EXIT INT TERM; \
    while :; do clear; printf '\\033[32m'; figlet -f big \"\$(date +%H:%M:%S)\"; printf '\\n\\033[2m[any key to exit]\\033[0m\\n'; read -rsn1 -t 1 && break; done; \
  else \
    tput civis; trap 'tput cnorm; clear' EXIT INT TERM; \
    while :; do clear; printf '\\033[1;32m%s\\033[0m\\n\\n\\033[2m[any key to exit]\\033[0m\\n' \"\$(date '+%H:%M:%S  %Y-%m-%d')\"; read -rsn1 -t 1 && break; done; \
  fi"
# --- Bell: quiet by default ----------------------------------------------------
set -g visual-bell off
set -g visual-activity off
set -g bell-action none

# ==============================================================================

# Host-specific overrides (silently skipped if missing)
source-file -q ~/.tmux.local.conf
set -g default-command "zsh -l"

# Allow kitty graphics protocol passthrough
set -g allow-passthrough on

# Window movement between sessions (fzf)
bind M display-popup -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh move_window"
# Dock current window into a pane of another window in this session (fzf)
bind D display-popup -xC -yC -w60% -h50% -E "${DOTFILES_GIT_REPO}/tmux/tmux.functions.sh dock_window"
bind L display-popup -E "tmux list-sessions -F '#S' | fzf --prompt='link window to> ' | xargs -I{} tmux link-window -t '{}:'"
bind S display-popup -E "tmux list-windows -a -F '#S:#I #W' | fzf --prompt='steal window> ' | awk '{print \$1}' | xargs -I{} tmux move-window -s '{}' -t ''"
