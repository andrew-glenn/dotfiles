# Kitty Config — ported from Ghostty
#
# This file holds only what every machine shares. Anything that differs per
# box (font size, padding, window decorations) lives in hosts/<name>.conf and
# is pulled in below through the host-active.conf symlink that deploy.sh
# generates. Host files are included last, so they win on any overlap.

# Behavior
confirm_os_window_close 0
scrollback_lines 999999
allow_remote_control yes
listen_on unix:/tmp/kitty-socket

# Background — fully opaque
background_opacity 1.0

# Keybindings
map super+shift+f toggle_fullscreen
map super+enter send_text all \x1b[13;3u

# URL handling
# URL handling. The plain-left-click-opens-URL binding is deliberately not
# here: it overrides kitty's default click-to-select and belongs to the Linux
# box, which set it. Ctrl+Shift+click still follows links on both machines.
open_url_with default
detect_urls yes
map kitty_mod+e kitten hints --type=url --program=default

# Colors — symlink into colors-hacker.conf / colors-daylight.conf, flipped by
# kitty/toggle-colors.sh. Generated per machine, not tracked.
include colors-active.conf

# Per-host settings. Relative symlink into hosts/, created by deploy.sh and
# left untracked so the Mac and the Linux box stop overwriting each other's
# font, padding, and decoration choices.
include host-active.conf

# Optional machine-local tweaks, never tracked. globinclude is used instead of
# include because it stays quiet when the file doesn't exist.
globinclude kitty.local.conf
