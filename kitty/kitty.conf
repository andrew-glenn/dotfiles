# Kitty Config — ported from Ghostty

# Behavior
macos_titlebar_color background
macos_quit_when_last_window_closed yes
confirm_os_window_close 0
scrollback_lines 999999

# Font
font_family MesloLGM Nerd Font
font_size 14
# A touch more breathing room, macOS-terminal rhythm
modify_font cell_height 95%
# Crisper text on low-DPI: gamma 1.0 + contrast boost fattens thin strokes
text_composition_strategy 0.5 75
allow_remote_control yes
listen_on unix:/tmp/kitty-socket

# Window / padding
window_padding_width 5 5
# Minimal / hidden decorations — clean Mac-terminal window
hide_window_decorations yes

# Background — fully opaque
background_opacity 1.0
dynamic_background_opacity yes

# Keybindings
map super+shift+f toggle_fullscreen
map super+enter send_text all \x1b[13;3u
map meta+0 no_op

# Tab bar — quiet, only shows when >1 tab; macOS-ish rounded separators
tab_bar_edge top
tab_bar_style separator
tab_separator "  ┃  "
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# Colors (managed by ~/bin/display-mode — edit colors-hacker.conf / colors-daylight.conf)
include colors-active.conf

# Change the click modifier (or leave empty to allow plain click)
mouse_map left click ungrabbed mouse_click_url_or_select

# Change which program opens the link
open_url_with default

# Detect URLs in plain text (already on by default)
detect_urls yes
map kitty_mod+e kitten hints --type=url --program=default
