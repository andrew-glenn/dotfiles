# Colors — hacker (dark)
# Pure black to match the i3bar background (#000000).
background #000000
foreground #ffffff
cursor #f0a050
cursor_shape block
cursor_blink_interval 0.5
selection_background #003a1a
selection_foreground #b0ffb0

# Tab bar — blends with the new top tab strip
active_tab_background #2a2622
active_tab_foreground #f8f0e8
active_tab_font_style bold
inactive_tab_background #1c1c1c
inactive_tab_foreground #8a7a6a
tab_bar_background #161616

# Normal colors (0-7) — boosted luminance ~15-20%
color0 #4a3d32
color1 #f05050
color2 #78e038
color3 #f0b828
color4 #48c0ff
color5 #d870f8
color6 #10e0b0
color7 #ffffff

# Bright colors (8-15)
color8 #6a5a4e
color9 #ff7070
color10 #90f050
color11 #ffd040
color12 #60d8ff
color13 #f088ff
color14 #30f8d0
color15 #ffffff
