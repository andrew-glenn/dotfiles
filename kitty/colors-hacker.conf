# Colors — hacker (dark, daylight-readable)
# Raised from #0a0a0a to #1c1c1c — enough luminance to not
# become a black mirror in sunlight, still unmistakably dark.
background #1c1c1c
foreground #ede0d0
cursor #f0a050
cursor_shape block
cursor_blink_interval 0.5
selection_background #5a4030
selection_foreground #fff8f0

# Normal colors (0-7) — boosted luminance ~15-20%
color0 #4a3d32
color1 #f05050
color2 #78e038
color3 #f0b828
color4 #48c0ff
color5 #d870f8
color6 #10e0b0
color7 #e8dcd0

# Bright colors (8-15)
color8 #6a5a4e
color9 #ff7070
color10 #90f050
color11 #ffd040
color12 #60d8ff
color13 #f088ff
color14 #30f8d0
color15 #f8f0e8
