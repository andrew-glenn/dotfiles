# macOS — the original feel: large text, generous margins, native window frame.

font_family Hack Nerd Font Mono
font_size 19

# Roomy margins. This is the single biggest contributor to how the Mac window
# reads; the 5 5 used on Linux makes text sit right against the edge.
window_padding_width 20 45

# Keep the native titlebar and rounded corners. Setting this to yes is what
# produced the hard square border that looked wrong here.
hide_window_decorations no
macos_titlebar_color background
macos_quit_when_last_window_closed yes

# Retina applies gamma correctly on its own, so leave text rendering alone
# rather than using the low-DPI contrast boost the Linux box needs.
text_composition_strategy platform

# Font size: current OS window only
map cmd+equal change_font_size current +1
map cmd+minus change_font_size current -1
map cmd+0 change_font_size current 0

# Send Option through as a real Alt modifier. By default macOS treats it as a
# compose key, so Alt+1 arrives as ¡ and tmux never sees M-1 at all. This is
# what makes the Alt bindings in tmux.conf reachable. Tradeoff: the Option
# compose layer is gone, so ¡ ™ £ and accented characters are no longer
# typeable that way. Use `left` instead to keep right-Option composing.
macos_option_as_alt yes
