# Linux / i3 — compact text, minimal chrome, tuned for a low-DPI display.

font_family MesloLGM Nerd Font
font_size 14
# A touch more breathing room, macOS-terminal rhythm
modify_font cell_height 95%
# Crisper text on low-DPI: gamma 1.0 + contrast boost fattens thin strokes
text_composition_strategy 0.5 75

window_padding_width 5 5

# Allow opacity to be changed at runtime (picom handles compositing here).
dynamic_background_opacity yes

# i3 draws its own window borders, so drop the client-side decorations.
hide_window_decorations yes

# Tab bar — quiet, only shows when >1 tab; rounded separators
tab_bar_edge top
tab_bar_style separator
tab_separator "  ┃  "
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# Change the click modifier (or leave empty to allow plain click)
mouse_map left click ungrabbed mouse_click_url_or_select
