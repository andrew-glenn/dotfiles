backend = "glx";
vsync = true;

# No dimming — pure CRT flatness, every window fully opaque.
# (Old Alacritty-specific opacity/focus rules removed; we run kitty now,
#  and kitty manages its own opacity in kitty.conf = 1.0.)

# fading is cheap polish
fading = true;
fade-in-step = 0.013;
fade-out-step = 0.013;
fade-delta = 6;

# subtle shadows — keep minimal for the CRT look
shadow = false;

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
