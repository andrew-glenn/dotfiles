# i3 colors — hacker (green on black)
# format: border  background  text  indicator  child_border
# Refined for clearer focus separation: focused window gets a bright
# phosphor border/child_border so it's obvious at a glance; unfocused
# states step down in brightness with real separation between them.
client.focused          #00ff00 #002200 #00ff00 #00cc00   #00cc00
client.focused_inactive #007700 #001100 #00bb00 #005500   #005500
client.unfocused        #004400 #000000 #007700 #002200   #002200
client.urgent           #ff0000 #330000 #ff5555 #ff0000   #ff0000
client.placeholder      #002200 #000000 #007700 #002200   #002200
client.background       #000000
